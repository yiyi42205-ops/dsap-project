<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg">
  <style>
    .sans{font-family:-apple-system,'Segoe UI','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}
    .edge{stroke:#8A8273;stroke-width:1.6;fill:none;}
    .edgeA{stroke:#C75B39;stroke-width:2.6;fill:none;}
    .node{fill:#FFFFFF;stroke:#B7AE9C;stroke-width:1.5;}
    .nodeA{fill:#FCEDE7;stroke:#C75B39;stroke-width:2;}
  </style>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#8A8273"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#C75B39"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="468" rx="14" fill="#FAF7F0" stroke="#DAD3C5"/>
  <text class="sans" x="34" y="42" font-size="20" font-weight="700" fill="#2B2B2B">全加器 Full Adder　—　電路即 DAG</text>
  <text class="sans" x="34" y="64" font-size="12.5" fill="#6B6457">節點＝邏輯閘，有向邊＝訊號流向。拓撲序：A, B, Cin → XOR₁, AND₁ → XOR₂, AND₂ → OR₁ → Sum, Cout</text>

  <!-- edges (normal) -->
  <line class="edge" marker-end="url(#arr)" x1="109" y1="230" x2="224" y2="160"/>
  <line class="edge" marker-end="url(#arr)" x1="109" y1="140" x2="224" y2="330"/>
  <line class="edge" marker-end="url(#arr)" x1="109" y1="230" x2="224" y2="330"/>
  <line class="edge" marker-end="url(#arr)" x1="109" y1="320" x2="424" y2="130"/>
  <line class="edge" marker-end="url(#arr)" x1="109" y1="320" x2="424" y2="250"/>
  <line class="edge" marker-end="url(#arr)" x1="313" y1="160" x2="424" y2="250"/>
  <line class="edge" marker-end="url(#arr)" x1="313" y1="330" x2="604" y2="330"/>
  <line class="edge" marker-end="url(#arr)" x1="513" y1="250" x2="604" y2="330"/>
  <line class="edge" marker-end="url(#arr)" x1="693" y1="330" x2="745" y2="330"/>

  <!-- edges (critical path) -->
  <line class="edgeA" marker-end="url(#arrA)" x1="109" y1="140" x2="224" y2="160"/>
  <line class="edgeA" marker-end="url(#arrA)" x1="313" y1="160" x2="424" y2="130"/>
  <line class="edgeA" marker-end="url(#arrA)" x1="513" y1="130" x2="745" y2="130"/>

  <!-- input nodes -->
  <rect class="nodeA" x="51" y="124" width="58" height="32" rx="16"/>
  <text class="mono" x="80" y="145" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2B2B">A</text>
  <rect class="node" x="51" y="214" width="58" height="32" rx="16"/>
  <text class="mono" x="80" y="235" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2B2B">B</text>
  <rect class="node" x="51" y="304" width="58" height="32" rx="16"/>
  <text class="mono" x="80" y="325" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2B2B">Cin</text>

  <!-- gate nodes -->
  <rect class="nodeA" x="227" y="137" width="86" height="46" rx="9"/>
  <text class="mono" x="270" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2B2B">XOR₁</text>
  <text class="mono" x="270" y="173" font-size="10" text-anchor="middle" fill="#6B6457">A⊕B</text>

  <rect class="node" x="227" y="307" width="86" height="46" rx="9"/>
  <text class="mono" x="270" y="328" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2B2B">AND₁</text>
  <text class="mono" x="270" y="343" font-size="10" text-anchor="middle" fill="#6B6457">A·B</text>

  <rect class="nodeA" x="427" y="107" width="86" height="46" rx="9"/>
  <text class="mono" x="470" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2B2B">XOR₂</text>
  <text class="mono" x="470" y="143" font-size="10" text-anchor="middle" fill="#6B6457">⊕ Cin</text>

  <rect class="node" x="427" y="227" width="86" height="46" rx="9"/>
  <text class="mono" x="470" y="248" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2B2B">AND₂</text>
  <text class="mono" x="470" y="263" font-size="10" text-anchor="middle" fill="#6B6457">XOR₁·Cin</text>

  <rect class="node" x="607" y="307" width="86" height="46" rx="9"/>
  <text class="mono" x="650" y="328" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2B2B">OR₁</text>
  <text class="mono" x="650" y="343" font-size="10" text-anchor="middle" fill="#6B6457">AND₁+AND₂</text>

  <!-- output nodes -->
  <rect class="nodeA" x="748" y="111" width="104" height="38" rx="19"/>
  <text class="mono" x="800" y="135" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2B2B">S = Sum</text>
  <rect class="node" x="748" y="311" width="104" height="38" rx="19"/>
  <text class="mono" x="800" y="335" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2B2B">C = Cout</text>

  <!-- legend -->
  <line class="edgeA" x1="36" y1="430" x2="74" y2="430"/>
  <text class="sans" x="84" y="434" font-size="12" fill="#6B6457">紅色＝critical path（到 Sum 最長路徑：A → XOR₁ → XOR₂ → Sum）</text>
  <text class="sans" x="36" y="455" font-size="11.5" fill="#9A917F">※ 閘名與拓撲僅為標準全加器結構，請對照你的 full_adder.txt 調整</text>
</svg>
